<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurrPal - AI Cat Companion</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FDF8F2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PurrPal" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23FDF8F2'/%3E%3Cpath d='M130 220 L110 100 L210 165 Z' fill='%23E88D4F'/%3E%3Cpath d='M382 220 L402 100 L302 165 Z' fill='%23E88D4F'/%3E%3Ccircle cx='256' cy='280' r='145' fill='%23F4A261'/%3E%3Ccircle cx='205' cy='265' r='18' fill='%232B2D42'/%3E%3Ccircle cx='307' cy='265' r='18' fill='%232B2D42'/%3E%3Ccircle cx='211' cy='259' r='6' fill='%23FFFFFF'/%3E%3Ccircle cx='313' cy='259' r='6' fill='%23FFFFFF'/%3E%3Cpolygon points='256,292 242,308 270,308' fill='%23E76F51'/%3E%3Cpath d='M226 322 Q241 338 256 322 Q271 338 286 322' stroke='%232B2D42' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #FDF8F2;
      --card: #FFFFFF;
      --text: #2B2D42;
      --muted: #6C757D;
      --accent: #E76F51;
      --accent-soft: #FDECE8;
      --warm: #F4A261;
      --border: #EFE5D8;
      --shadow: 0 8px 24px rgba(43, 45, 66, 0.08);
    }
    body.night {
      --bg: #1B1E2B;
      --card: #252A3D;
      --text: #F4F1DE;
      --muted: #A8B2D1;
      --accent: #FF8566;
      --accent-soft: #362C3B;
      --warm: #F4A261;
      --border: #343B54;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.25rem; font-weight: 800; }
    .badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .subtitle { font-size: 0.8rem; color: var(--muted); }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s;
    }
    button:active { transform: scale(0.96); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      padding: 18px;
      max-width: 1150px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 780px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .bond-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .progress-track {
      flex: 1;
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--warm), var(--accent));
      width: 30%;
      transition: width 0.35s ease;
    }
    .room {
      position: relative;
      flex: 1;
      min-height: 270px;
      background: linear-gradient(180deg, #F6EDE2 0%, #EFE2D1 68%, #DEC7AB 68%, #D4B895 100%);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 22px;
      cursor: pointer;
      user-select: none;
    }
    body.night .room {
      background: linear-gradient(180deg, #1E2436 0%, #272E45 68%, #1C2030 68%, #151824 100%);
    }
    .window {
      position: absolute;
      top: 22px;
      left: 24px;
      width: 86px;
      height: 86px;
      background: #A8DADC;
      border: 5px solid #FFFFFF;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
    }
    body.night .window { background: #2B3A67; border-color: #4A5568; }
    .sun-moon {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFD166;
    }
    body.night .sun-moon { background: #F4F1DE; box-shadow: 0 0 10px #F4F1DE; }
    .cat-wrap {
      position: relative;
      width: 155px;
      height: 155px;
      transition: transform 0.2s;
      z-index: 2;
    }
    .cat-wrap.bounce { animation: hop 0.45s ease; }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-18px) scale(1.04); }
    }
    .heart-float {
      position: absolute;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 1s ease forwards;
      z-index: 5;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-65px) scale(1.3); }
    }
    .laser-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FF2A5F;
      box-shadow: 0 0 12px #FF2A5F, 0 0 24px #FF2A5F;
      display: none;
      z-index: 4;
      transition: left 0.35s ease, top 0.35s ease;
    }
    .hint-pill {
      margin-top: 8px;
      background: rgba(255,255,255,0.75);
      color: #2B2D42;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      z-index: 2;
    }
    .stats-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }
    .ai-banner {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }
    .ai-status { font-weight: 700; color: var(--accent); }
    .chat-box {
      flex: 1;
      min-height: 240px;
      max-height: 360px;
      overflow-y: auto;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 84%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .msg.cat {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg em { color: var(--accent); font-style: italic; font-weight: 600; }
    .quick-prompts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .quick-prompts button {
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg);
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 390px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal label { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px; }
    .modal select, .modal input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span style="font-size:1.6rem;">🐾</span>
      <div>
        <div style="display:flex;align-items:center;gap:8px;">
          <h1 id="catNameDisplay">Mochi</h1>
          <span class="badge" id="personalityDisplay">Sweet &amp; Clingy</span>
        </div>
        <div class="subtitle" id="moodStatus">Feeling cozy &amp; purring softly ✨</div>
      </div>
    </div>
    <div class="top-actions">
      <button id="themeBtn">☀️ Day</button>
      <button id="soundBtn">🔊 Sound On</button>
      <button id="accountBtn">👤 Maya</button>
      <button class="primary" id="customizeBtn">🎀 Customize</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="bond-bar">
        <span>❤️ Bond Lv. <span id="bondLv">1</span></span>
        <div class="progress-track"><div class="progress-fill" id="bondFill"></div></div>
      </div>

      <div class="room" id="catRoom" title="Tap Mochi to pet!">
        <div class="window"><div class="sun-moon"></div></div>
        <div class="laser-dot" id="laserDot"></div>
        <div class="cat-wrap" id="catSprite">
          <svg viewBox="0 0 200 200" width="155" height="155">
            <!-- Tail -->
            <path d="M145 155 Q185 135 175 95" stroke="#E88D4F" stroke-width="14" stroke-linecap="round" fill="none" id="catTail"/>
            <!-- Body -->
            <ellipse cx="100" cy="145" rx="46" ry="38" fill="#F4A261" id="catBody"/>
            <ellipse cx="100" cy="150" rx="28" ry="24" fill="#FDE8D7"/>
            <!-- Ears -->
            <polygon points="56,78 46,32 86,58" fill="#E88D4F" id="earL"/>
            <polygon points="144,78 154,32 114,58" fill="#E88D4F" id="earR"/>
            <polygon points="60,72 53,42 80,60" fill="#F7B2B7"/>
            <polygon points="140,72 147,42 120,60" fill="#F7B2B7"/>
            <!-- Head -->
            <circle cx="100" cy="92" r="48" fill="#F4A261" id="catHead"/>
            <!-- Stripes -->
            <path d="M92 48 L92 60 M100 46 L100 62 M108 48 L108 60" stroke="#D97736" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Eyes -->
            <circle cx="80" cy="90" r="8" fill="#2B2D42"/>
            <circle cx="120" cy="90" r="8" fill="#2B2D42"/>
            <circle cx="83" cy="87" r="3" fill="#FFF"/>
            <circle cx="123" cy="87" r="3" fill="#FFF"/>
            <!-- Blush -->
            <ellipse cx="67" cy="102" rx="7" ry="4" fill="#FF9EBB" opacity="0.75"/>
            <ellipse cx="133" cy="102" rx="7" ry="4" fill="#FF9EBB" opacity="0.75"/>
            <!-- Nose & Mouth -->
            <polygon points="100,98 94,104 106,104" fill="#E76F51"/>
            <path d="M89 109 Q95 116 100 109 Q105 116 111 109" stroke="#2B2D42" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- Paws -->
            <ellipse cx="78" cy="176" rx="14" ry="9" fill="#FDE8D7"/>
            <ellipse cx="122" cy="176" rx="14" ry="9" fill="#FDE8D7"/>
          </svg>
        </div>
        <div class="hint-pill">✨ Tap Mochi to pet &amp; purr!</div>
      </div>

      <div class="stats-row">
        <span style="font-size:0.85rem;font-weight:700;">🍖 Fullness</span>
        <div class="progress-track"><div class="progress-fill" id="fullnessFill" style="width:71%;"></div></div>
        <span style="font-size:0.85rem;font-weight:700;" id="fullnessPct">71%</span>
      </div>

      <div class="actions-grid">
        <button id="feedBtn">🐟 Feed Treat</button>
        <button id="laserBtn">🔴 Play Laser</button>
      </div>
    </section>

    <section class="panel">
      <div class="chat-header">
        <div>
          <h2 style="font-size:1.05rem;">💬 Meow-Translator AI</h2>
          <div class="subtitle" id="chatSub">Chatting with Mochi</div>
        </div>
        <button id="clearChatBtn">Clear Chat</button>
      </div>

      <div class="ai-banner">
        <div>
          <span class="ai-status" id="aiStatusText">⚡ Quick-Purr Mode (Instant)</span>
          <div class="subtitle" id="aiSubText">Tap to load real in-browser AI (no API key needed!)</div>
        </div>
        <button class="primary" id="loadAiBtn">🧠 Load Local AI Brain</button>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="quick-prompts">
        <button data-q="Tell me a secret">Tell me a secret</button>
        <button data-q="Play laser with me!">Play laser</button>
        <button data-q="What is your favorite snack?">Favorite snack?</button>
        <button data-q="Give me a cheer up pep talk!">Cheer me up</button>
      </div>

      <form class="input-row" id="chatForm">
        <input type="text" id="chatInput" placeholder="Say something to Mochi..." autocomplete="off" />
        <button type="submit" class="primary">Send 🐾</button>
      </form>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3 style="font-size:1.1rem;">🎀 Customize Your Companion</h3>
      <div>
        <label>Your Name</label>
        <input type="text" id="inputUserName" value="Maya" />
      </div>
      <div>
        <label>Cat Name</label>
        <input type="text" id="inputCatName" value="Mochi" />
      </div>
      <div>
        <label>Fur Color</label>
        <select id="inputFurColor">
          <option value="#F4A261|#E88D4F">Warm Ginger Tabby</option>
          <option value="#ECEAE4|#D5D2C8">Creamy Cloud White</option>
          <option value="#4A4E69|#22223B">Midnight Tuxedo</option>
          <option value="#F7CAD0|#F4978E">Strawberry Sakura</option>
        </select>
      </div>
      <div>
        <label>Personality</label>
        <select id="inputPersonality">
          <option value="Sweet & Clingy">Sweet &amp; Clingy</option>
          <option value="Sassy & Royal">Sassy &amp; Royal</option>
          <option value="Chaotic Zoomies">Chaotic Zoomies</option>
          <option value="Sleepy Philosopher">Sleepy Philosopher</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button id="closeModalBtn">Cancel</button>
        <button class="primary" id="saveModalBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
    env.allowLocalModels = false;

    const state = {
      userName: localStorage.getItem('pp_user') || 'Maya',
      catName: localStorage.getItem('pp_cat') || 'Mochi',
      personality: localStorage.getItem('pp_pers') || 'Sweet & Clingy',
      fur: localStorage.getItem('pp_fur') || '#F4A261|#E88D4F',
      bondXp: Number(localStorage.getItem('pp_xp') || 30),
      fullness: Number(localStorage.getItem('pp_full') || 71),
      sound: true,
      night: false,
      aiGenerator: null,
      aiLoading: false,
      history: []
    };

    const $ = (id) => document.getElementById(id);

    // Simple Web Audio Purr/Meow chime
    function playMeow(freq = 540) {
      if (!state.sound) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.35, ctx.currentTime + 0.14);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.85, ctx.currentTime + 0.32);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.34);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function updateUI() {
      $('catNameDisplay').textContent = state.catName;
      $('personalityDisplay').textContent = state.personality;
      $('accountBtn').textContent = `👤 ${state.userName}`;
      $('chatSub').textContent = `Chatting with ${state.catName}`;
      const lv = Math.floor(state.bondXp / 100) + 1;
      const pct = state.bondXp % 100;
      $('bondLv').textContent = lv;
      $('bondFill').style.width = `${pct}%`;
      $('fullnessFill').style.width = `${state.fullness}%`;
      $('fullnessPct').textContent = `${state.fullness}%`;

      const [mainFur, darkFur] = state.fur.split('|');
      $('catBody').setAttribute('fill', mainFur);
      $('catHead').setAttribute('fill', mainFur);
      $('earL').setAttribute('fill', darkFur);
      $('earR').setAttribute('fill', darkFur);
      $('catTail').setAttribute('stroke', darkFur);

      localStorage.setItem('pp_user', state.userName);
      localStorage.setItem('pp_cat', state.catName);
      localStorage.setItem('pp_pers', state.personality);
      localStorage.setItem('pp_fur', state.fur);
      localStorage.setItem('pp_xp', state.bondXp);
      localStorage.setItem('pp_full', state.fullness);
    }

    function addXP(pts) {
      state.bondXp += pts;
      updateUI();
    }

    function spawnHeart(x, y) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = ['💖', '🐾', '✨', '💕'][Math.floor(Math.random() * 4)];
      h.style.left = `${x || 140}px`;
      h.style.top = `${y || 120}px`;
      $('catRoom').appendChild(h);
      setTimeout(() => h.remove(), 1000);
    }

    function appendMsg(sender, text, isThinking = false) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      if (isThinking) div.id = 'thinkingBubble';
      div.innerHTML = text.replace(/\*(.*?)\*/g, '<em>*$1*</em>');
      $('chatBox').appendChild(div);
      $('chatBox').scrollTop = $('chatBox').scrollHeight;
      return div;
    }

    // Load Transformers.js Small Language Model (SmolLM2-135M-Instruct)
    $('loadAiBtn').addEventListener('click', async () => {
      if (state.aiGenerator || state.aiLoading) return;
      state.aiLoading = true;
      $('loadAiBtn').disabled = true;
      $('loadAiBtn').textContent = '⏳ Downloading...';
      $('aiStatusText').textContent = '🧠 Loading SmolLM2 AI Model...';
      $('aiSubText').textContent = 'First download (~118 MB) saves in browser cache for instant offline use later!';

      try {
        state.aiGenerator = await pipeline(
          'text-generation',
          'HuggingFaceTB/SmolLM2-135M-Instruct',
          {
            dtype: 'q4f16',
            progress_callback: (p) => {
              if (p.status === 'progress' && p.total) {
                const pct = Math.round((p.loaded / p.total) * 100);
                $('aiStatusText').textContent = `🧠 Downloading Brain: ${pct}%`;
              }
            }
          }
        );
        $('aiStatusText').textContent = '✨ Real Local AI Active (SmolLM2)';
        $('aiSubText').textContent = '100% private & free on your tablet — no API key used!';
        $('loadAiBtn').textContent = '✅ AI Ready';
        playMeow(660);
        appendMsg('cat', `*ears perk up with sparkling eyes* Mrrp!! My real AI brain just woke up, ${state.userName}! Ask me anything at all! 🐾✨`);
      } catch (err) {
        console.error(err);
        state.aiLoading = false;
        $('loadAiBtn').disabled = false;
        $('loadAiBtn').textContent = '🔄 Retry AI Load';
        $('aiStatusText').textContent = '⚠️ Could not load model (using Quick-Purr)';
        $('aiSubText').textContent = 'Your browser may be low on RAM, so Quick-Purr mode stays active!';
      }
    });

    function fallbackReply(input) {
      const q = input.toLowerCase();
      const c = state.catName;
      const u = state.userName;
      if (q.includes('secret')) {
        return `*looks left and right, then whispers softly* Meow... sometimes when you're away, ${c} practices batting invisible dust bunnies so I can protect ${u}! 🤫🐾`;
      }
      if (q.includes('snack') || q.includes('treat') || q.includes('food')) {
        return `*licks whiskers happily* Crunchy salmon bites are #1, obviously! Though ${c} would happily share a warm cozy nap with ${u} right after! 🐟💕`;
      }
      if (q.includes('cheer') || q.includes('sad') || q.includes('pep')) {
        return `*climbs onto your lap and purrs loudly* Mrrp! ${u}, you are ${c}'s favorite human in the whole wide world! Take a deep breath—we've got this together! 💖✨`;
      }
      if (q.includes('laser')) {
        triggerLaser();
        return `*pupils go huge and wiggles back paws* TARGET ACQUIRED! Watch ${c} catch that red dot!! 🔴⚡`;
      }
      const generic = [
        `*headbutts your hand gently* Meow! Tell ${c} more, ${u}! My whiskers are listening closely! ✨`,
        `*kneads the soft rug with tiny paws* Purrrrr~ ${c} loves hanging out with ${u}! 🐾💕`,
        `*tilts head curiously* Mrrp? That sounds super interesting, ${u}! Want a treat break while we chat? 🐟`
      ];
      return generic[Math.floor(Math.random() * generic.length)];
    }

    async function handleChat(userText) {
      if (!userText.trim()) return;
      appendMsg('user', userText);
      addXP(8);

      if (!state.aiGenerator) {
        setTimeout(() => {
          playMeow(560);
          appendMsg('cat', fallbackReply(userText));
        }, 320);
        return;
      }

      const thinking = appendMsg('cat', `*${state.catName} is thinking with twitching whiskers...*`, true);
      try {
        const messages = [
          {
            role: 'system',
            content: `You are ${state.catName}, a cute talking pet cat with a "${state.personality}" personality. Your human's name is ${state.userName}. Keep replies short (1-3 sentences), playful, warm, and include cute cat actions in *asterisks* plus occasional "meow" or "mrrp". Never break character.`
          },
          ...state.history.slice(-4),
          { role: 'user', content: userText }
        ];

        const output = await state.aiGenerator(messages, {
          max_new_tokens: 85,
          temperature: 0.75,
          do_sample: true
        });

        const generated = output[0].generated_text;
        const reply = Array.isArray(generated)
          ? generated[generated.length - 1].content
          : String(generated);

        thinking.remove();
        state.history.push({ role: 'user', content: userText }, { role: 'assistant', content: reply });
        playMeow(600);
        appendMsg('cat', reply.trim());
      } catch (e) {
        thinking.remove();
        appendMsg('cat', fallbackReply(userText));
      }
    }

    function triggerLaser() {
      const dot = $('laserDot');
      dot.style.display = 'block';
      let moves = 0;
      const interval = setInterval(() => {
        dot.style.left = `${20 + Math.random() * 75}%`;
        dot.style.top = `${25 + Math.random() * 60}%`;
        $('catSprite').classList.remove('bounce');
        void $('catSprite').offsetWidth;
        $('catSprite').classList.add('bounce');
        moves++;
        if (moves >= 5) {
          clearInterval(interval);
          dot.style.display = 'none';
          addXP(12);
          $('moodStatus').textContent = `${state.catName} caught the red dot! 🏆`;
        }
      }, 420);
    }

    $('catRoom').addEventListener('click', (e) => {
      const rect = $('catRoom').getBoundingClientRect();
      spawnHeart(e.clientX - rect.left, e.clientY - rect.top);
      $('catSprite').classList.remove('bounce');
      void $('catSprite').offsetWidth;
      $('catSprite').classList.add('bounce');
      playMeow(580);
      addXP(5);
      $('moodStatus').textContent = `Purring happily from ${state.userName}'s pets 💕`;
    });

    $('feedBtn').addEventListener('click', () => {
      state.fullness = Math.min(100, state.fullness + 12);
      addXP(10);
      playMeow(640);
      spawnHeart(150, 110);
      $('moodStatus').textContent = `Yum! ${state.catName} loved that salmon treat 🐟`;
      appendMsg('cat', `*cronch cronch* Mrrp!! Thank you for the yummy treat, ${state.userName}! Fullness is now ${state.fullness}%! 🐟💖`);
    });

    $('laserBtn').addEventListener('click', () => {
      playMeow(680);
      triggerLaser();
    });

    $('themeBtn').addEventListener('click', () => {
      state.night = !state.night;
      document.body.classList.toggle('night', state.night);
      $('themeBtn').textContent = state.night ? '🌙 Night' : '☀️ Day';
    });

    $('soundBtn').addEventListener('click', () => {
      state.sound = !state.sound;
      $('soundBtn').textContent = state.sound ? '🔊 Sound On' : '🔇 Muted';
    });

    $('clearChatBtn').addEventListener('click', () => {
      $('chatBox').innerHTML = '';
      state.history = [];
      appendMsg('cat', `*stretches front paws and blinks sparkly eyes* Mrrp! Fresh start, ${state.userName}! What shall we talk about? 🐾`);
    });

    document.querySelectorAll('.quick-prompts button').forEach((btn) => {
      btn.addEventListener('click', () => handleChat(btn.dataset.q));
    });

    $('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = $('chatInput').value;
      $('chatInput').value = '';
      handleChat(val);
    });

    // Customize Modal
    const openModal = () => {
      $('inputUserName').value = state.userName;
      $('inputCatName').value = state.catName;
      $('inputFurColor').value = state.fur;
      $('inputPersonality').value = state.personality;
      $('modalBackdrop').style.display = 'flex';
    };
    $('customizeBtn').addEventListener('click', openModal);
    $('accountBtn').addEventListener('click', openModal);
    $('closeModalBtn').addEventListener('click', () => ($('modalBackdrop').style.display = 'none'));
    $('saveModalBtn').addEventListener('click', () => {
      state.userName = $('inputUserName').value.trim() || 'Maya';
      state.catName = $('inputCatName').value.trim() || 'Mochi';
      state.fur = $('inputFurColor').value;
      state.personality = $('inputPersonality').value;
      $('modalBackdrop').style.display = 'none';
      updateUI();
      appendMsg('cat', `*spins in a happy circle* Meow! ${state.catName} is ready to play with ${state.userName}! 🎀✨`);
    });

    updateUI();
    appendMsg('cat', `*stretches front paws and blinks sparkly eyes* Mrrp! Welcome home! ${state.catName} saved the warmest spot on the rug just for ${state.userName}. Tap **"Load Local AI Brain"** above anytime to unlock free local AI chat! 🐾💕`);
  </script>
</body>
</html>
